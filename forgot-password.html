<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dib u soo cesho furahaaga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div style="width:52px;height:52px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;background:#1c1a1f;border:1px solid #3a3330;border-radius:16px;color:#f5a623;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5" transform="rotate(-20 7.5 15.5)"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/></svg>
    </div>

    <h1>Dib u soo cesho furahaaga</h1>
    <p class="subtitle">Geli email-kaaga si aan kuugu soo dirno koodhka xaqiijinta ee dib-u-dejinta.</p>

    <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:28px;padding:18px;background:var(--input-bg);border:1px solid var(--border);border-radius:16px;font-size:0.95rem;line-height:1.6;">
      <svg viewBox="0 0 24 24" width="22" height="22" style="flex-shrink:0;color:#f5a623;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3Z"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>Haddii email-ku jiro diiwaanka, waxaad heli doontaa koodh 6-lambar ah oo soconaya 10 daqiiqo.</span>
    </div>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">Email-kaaga Diiwaangashan</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input type="email" id="email" name="email" placeholder="magacaaga@shirkad.so" autocomplete="email" required>
        </div>
      </div>

      <button type="submit" id="sendBtn" class="btn-primary">
        Soo dir Koodhka Xaqiijinta
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="login-link">
      <a href="login.html" style="display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-weight:500;margin-left:0;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Ku noqo bogga galitaanka
      </a>
    </p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="module" src="forgot-password.js"></script>
</body>
</html>
